<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Curly MusicKey</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --bg: #050607; --panel: #0e1012; --line: #1d2025; --dim: #7d858c; --txt: #f2f4f5;
    --amber: #ffb000; --cyan: #7fe3ff; --red: #ff4d3d; --bass: #56d6b0; --mel: #8ab4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
               font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif; }
  #app { min-height: 100dvh; padding: 10px 8px; display: flex; flex-direction: column; gap: 10px; }
  small { font-size: 10px; font-weight: 700; color: var(--dim); }

  /* 상단 LCD */
  .lcd { background: var(--panel); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line);
         padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 6px; }
  .lcd-top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-size: 9px; letter-spacing: .24em; font-weight: 800; color: var(--dim); }
  #state { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
  #dot { width: 8px; height: 8px; border-radius: 4px; background: #3a3f45; }
  #dot.on { background: var(--bass); box-shadow: 0 0 8px var(--bass); }
  .lcd-inst { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; overflow: hidden; height: 32px; }
  #instNum { font-family: var(--mono); font-size: 26px; font-weight: 800; line-height: 1; }
  #instName { font-size: 25px; font-weight: 800; letter-spacing: -0.02em; }
  .lcd-sub { display: flex; gap: 20px; border-top: 1px solid var(--line); padding-top: 7px; }
  .lcd-sub div { display: flex; align-items: baseline; gap: 7px; }
  #kit { font-size: 16px; font-weight: 800; color: var(--amber); }
  #oct { font-size: 16px; font-weight: 800; color: var(--cyan); }

  /* 시작 버튼 */
  #start { height: 162px; flex: none; border: none; border-radius: 8px; background: #e8ecef; color: var(--bg);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: inherit; }
  #start .st-main { display: flex; align-items: center; gap: 12px; font-size: 58px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  #start .st-main i { width: 14px; height: 14px; border-radius: 7px; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  #start .st-sub { font-size: 13px; font-weight: 700; color: #4a5158; }

  /* 시퀀서 */
  #seq { display: none; flex-direction: column; gap: 6px; padding: 0 2px; flex: none; }
  .seq-top { display: flex; align-items: baseline; gap: 6px; height: 24px; }
  #bpm { font-family: var(--mono); font-size: 22px; font-weight: 800; line-height: 1; }
  .sp { flex: 1; }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 3px;
          letter-spacing: .04em; align-self: center; color: #3a3f45; box-shadow: inset 0 0 0 1px var(--line); }
  #chipPlay.on { background: var(--cyan); color: #001a22; box-shadow: none; }
  #chipRec.on { background: var(--red); color: #0a0201; box-shadow: none; }
  #chipMet.on { background: #e8ecef; color: var(--bg); box-shadow: none; }
  #shiftChip.on { background: var(--red); color: #0a0201; box-shadow: none; }
  #grid { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 2px; }
  .c { height: 10px; border-radius: 2px; background: #111316; }
  .c.down { background: #181b1f; }
  .c.ph { background: #2f353c; }
  .c.hit { background: var(--amber); }
  .c.fx { background: var(--red); }
  .c.mel { background: var(--cyan); }
  .c.tail { opacity: .5; }
  .c.ph.hit, .c.ph.fx, .c.ph.mel { background: #fff; opacity: 1; }
  .c.gap { margin-right: 3px; }
  .c.melrow { margin-top: 4px; }

  /* 키보드 안내도: 자주 쓰는 Z줄·A줄은 높게, 줄마다 남는 폭은 그 줄 키들이 나눠 가진다 */
  .kbwrap { display: flex; flex-direction: column; gap: 3px; margin-top: auto; }
  .kbhead { display: flex; justify-content: flex-end; align-items: center; height: 18px; }
  .kr { display: flex; gap: 3px; flex: none; }
  .kr.r0 { height: 30px; }
  .kr.r1 { height: 44px; padding-left: 12px; }
  .kr.r2 { height: 58px; padding-left: 20px; }
  .kr.r3 { height: 64px; padding-left: 30px; }
  .k { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
       padding: 3px 2px 4px; overflow: hidden; border-radius: 4px; background: #0b0c0e; color: #2f343a;
       transition: transform 80ms ease-out; }
  .k b { display: block; text-align: left; font-family: var(--mono); font-size: 9px; font-weight: 700; opacity: .6; line-height: 1; }
  .k span { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
            white-space: pre-line; letter-spacing: -0.03em; line-height: 1; font-weight: 800; }
  .r0 .k b { font-size: 11px; font-weight: 800; text-align: center; opacity: 1; }
  .r0 .k span { font-size: 8px; font-weight: 700; }
  .r1 .k b { font-size: 8px; }
  .r1 .k span { font-size: 13px; }
  .r2 .k span { font-size: 21px; }
  .r3 .k span { font-size: 13px; line-height: 1.05; letter-spacing: -0.06em; }

  .k.drum { background: #15110a; color: var(--amber); box-shadow: inset 0 3px 0 var(--amber), inset 0 0 0 1px #3a2c10; border-radius: 6px; }
  .k.drum.on { background: var(--amber); color: #0a0700; box-shadow: 0 0 18px rgba(255,176,0,.75); transform: scale(.92); }
  .k.fx { background: var(--red); color: #0a0201; box-shadow: inset 0 0 0 1px #ff8a7e; border-radius: 6px; }
  .k.fx.on { background: #ffd0cb; color: #3a0500; box-shadow: 0 0 0 2px var(--red), 0 0 18px rgba(255,77,61,.85); transform: scale(.92); }
  .k.white { background: #e8ecef; color: #0b0d0f; }
  .k.black { background: #000; color: #cfd6dc; box-shadow: inset 0 0 0 1px #2f343a; }
  .k.white.on, .k.black.on { background: var(--cyan); color: #001a22; box-shadow: 0 0 16px rgba(127,227,255,.75); transform: translateY(3px); }
  .k.inst { --g: var(--mel); background: var(--panel); color: var(--g); box-shadow: inset 0 -2px 0 var(--g); }
  .k.inst.bass { --g: var(--bass); }
  .k.inst.sel { background: var(--g); color: #000; box-shadow: 0 0 12px var(--g); }
  .k.func { background: var(--panel); color: #cfd6dc; box-shadow: inset 0 -2px 0 #cfd6dc; }
  .k.func.sel { background: var(--txt); color: #000; }
  .k.inst.on, .k.func.on { transform: scale(.92); }

  /* 보조 키 안내 */
  .help { display: flex; flex-wrap: wrap; gap: 5px 12px; font-size: 11px; color: #a3abb2; font-weight: 600; padding: 0 2px; }
  .help span { display: flex; align-items: center; gap: 4px; }
  kbd { font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--bg); background: #cfd6dc;
        border-radius: 3px; padding: 1px 4px; }
  kbd.red { background: var(--red); color: #0a0201; }
  .help .note { width: 100%; color: var(--dim); font-size: 10px; }

  /* 시각화: 화면 전체를 덮고, 맨 아래에 정보 띠 */
  #viz { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #viz canvas { width: 100%; height: 100%; display: block; }
  .vband { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 10px 14px;
           border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: #000; }
  .vrow { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; overflow: hidden; }
  #vNum { font-family: var(--mono); font-size: 19px; font-weight: 800; }
  #vName { font-size: 19px; font-weight: 800; }
  #vKit { font-size: 17px; font-weight: 800; color: var(--amber); }
  #vOct { font-size: 17px; font-weight: 800; color: var(--cyan); }
  .vclose { align-self: flex-end; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
            color: #cfd6dc; box-shadow: inset 0 0 0 1px #2f343a; border-radius: 999px; padding: 5px 12px; }
  .vclose b { font-family: var(--mono); }
</style>
</head>
<body>
<div id="app">
  <div class="lcd">
    <div class="lcd-top">
      <span class="brand">CURLY MUSICKEY</span>
      <span id="state"><i id="dot"></i><span id="stateTxt">오디오 꺼짐</span></span>
    </div>
    <div class="lcd-inst"><span id="instNum"></span><span id="instName"></span></div>
    <div class="lcd-sub">
      <div><small>킷</small><span id="kit"></span></div>
      <div><small>옥타브</small><span id="oct"></span></div>
    </div>
  </div>

  <button id="start">
    <span class="st-main"><i></i>시작</span>
    <span class="st-sub">탭해서 소리 켜기</span>
  </button>

  <div id="seq">
    <div class="seq-top">
      <span id="bpm">128</span><small>BPM</small><span class="sp"></span>
      <span id="chipPlay" class="chip">■ 정지</span>
      <span id="chipRec" class="chip">● REC</span>
      <span id="chipMet" class="chip">MET</span>
    </div>
    <div id="grid"></div>
  </div>

  <div class="kbwrap">
    <div class="kbhead"><span id="shiftChip" class="chip">⇧ SHIFT · 효과음</span></div>
    <div id="kb"></div>
  </div>

  <div class="help">
    <span><kbd>Space</kbd>재생</span>
    <span><kbd>Enter</kbd>녹음</span>
    <span><kbd>Tab</kbd>메트로놈</span>
    <span><kbd>⌫</kbd>지우기</span>
    <span><kbd>- =</kbd>BPM</span>
    <span><kbd>Q</kbd>랜덤 비트</span>
    <span><kbd>←→</kbd>킷</span>
    <span><kbd>↑↓</kbd>옥타브</span>
    <span><kbd class="red">⇧+Z줄</kbd>효과음</span>
    <span><kbd>`</kbd>시각화</span>
    <span><kbd>Esc</kbd>전체 정지</span>
    <span class="note">Shift와 함께: Q 랜덤 음색 · ⌫ 전체 지우기 · - = BPM 5씩</span>
  </div>
</div>

<div id="viz">
  <canvas id="vizCanvas"></canvas>
  <div class="vband">
    <div class="vrow">
      <span><span id="vNum"></span> <span id="vName"></span></span>
      <span id="vKit"></span>
      <span id="vOct"></span>
    </div>
    <span class="vclose"><b>`</b>또는 탭하면 닫기</span>
  </div>
</div>

<script>
// ================= 키 배치 =================
const DRUM_KEYS = ["KeyZ","KeyX","KeyC","KeyV","KeyB","KeyN","KeyM","Comma","Period","Slash"];
// 드럼 자리별 역할. 킷이 바뀌어도 같은 자리는 같은 역할 (Z = 항상 킥). \n = 안내도에서 줄바꿈
const DRUM_NAMES = ["킥","스네","클랩","닫힌\nHH","열린\nHH","로우\n탐","하이\n탐","림","카우\n벨","크래\n시"];
// 건반: code → A키의 도(0)에서 몇 반음 위인지 (에이블톤/로직의 컴퓨터 키보드 연주 배치)
const NOTE_KEYS = {
  KeyA: 0, KeyW: 1, KeyS: 2, KeyE: 3, KeyD: 4, KeyF: 5, KeyT: 6, KeyG: 7,
  KeyY: 8, KeyH: 9, KeyU: 10, KeyJ: 11, KeyK: 12, KeyO: 13, KeyL: 14,
  KeyP: 15, Semicolon: 16, Quote: 17, BracketRight: 18,
};
const NOTE_NAMES = ["도","도#","레","레#","미","파","파#","솔","솔#","라","라#","시"];
const LETTER_NAMES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const OCT_MIN = -2, OCT_MAX = 2;

// ================= 상태 =================
let ctx = null, master = null, analyser = null, noiseBuf = null, verbBuf = null;
let verbIn = null, delayIn = null, delayNode = null, wet = null, fxBus = null, kitBuses = [];
let out = null;           // 드럼·효과음 재료가 연결될 곳 (킷마다 다름)
let inst = 4;             // 지금 선택된 악기 (INSTS 번호, 4 = 리드, -1 = 랜덤 음색)
let randomDef = null;     // Shift+Q로 만든 랜덤 음색
let kitIndex = 0;         // 드럼 킷 번호
let octave = 0;           // 옥타브 이동 (-2 ~ +2)
const pressed = new Set();  // 지금 눌린 키(code)
const held = new Map();     // 누르고 있는 건반 code → 울리는 소리
const active = new Set();   // 지금 울리는 모든 소리 (Esc용)

const $ = id => document.getElementById(id);
const curDef = () => (inst === -1 ? randomDef : INSTS[inst]);

// ================= 오디오 기본 =================
// 소리 → master(음량) → 컴프레서(리미터처럼 강하게) → 분석기(시각화) → 스피커
// 리버브·딜레이는 '보내기(send)'로 master에 섞는다
function initAudio(c) {
  ctx = c;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -12;
  comp.knee.value = 0;
  comp.ratio.value = 20;
  comp.attack.value = 0.002;
  comp.release.value = 0.15;
  analyser = ctx.createAnalyser();
  analyser.fftSize = 2048;
  master = ctx.createGain();
  master.gain.value = 0.5;
  master.connect(comp).connect(analyser).connect(ctx.destination);

  // 화이트 노이즈 2초 (스네어, 하이햇, 클랩, 효과음 재료)
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;

  verbBuf = impulse(2.5, 3);
  verbIn = ctx.createGain();
  delayIn = ctx.createGain();
  wet = null;
  buildWet();

  // 효과음 버스: 리버브를 조금 섞는다
  fxBus = ctx.createGain();
  fxBus.connect(master);
  fxBus.connect(gainNode(0.35)).connect(verbIn);

  // 킷별 버스: 로파이는 고음 깎기+찌그러짐, 80s는 게이트 리버브
  kitBuses = KITS.map(k => {
    const b = k.bus || {};
    const input = ctx.createGain();
    let node = input;
    if (b.lp) node = node.connect(filterNode("lowpass", b.lp));
    if (b.drive) node = node.connect(shaper(b.drive));
    node.connect(master);
    if (b.gated) {
      const conv = ctx.createConvolver();
      conv.buffer = impulse(0.35, 0.3);
      input.connect(conv).connect(gainNode(0.6)).connect(master);
    }
    return input;
  });
}

function gainNode(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
function filterNode(type, freq, Q = 1) {
  const f = ctx.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = Q;
  return f;
}

// 리버브용 '공간 울림' 데이터: 노이즈가 점점 작아지는 모양. pow가 클수록 빨리 줄어든다
function impulse(sec, pow) {
  const len = Math.floor(ctx.sampleRate * sec);
  const buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow);
  }
  return buf;
}

// 찌그러뜨리기(디스토션). k가 클수록 세게
const curves = {};
function shaper(k) {
  if (!curves[k]) {
    const c = new Float32Array(1024);
    for (let i = 0; i < c.length; i++) {
      const x = i / 511.5 - 1;
      c[i] = ((1 + k) * x) / (1 + k * Math.abs(x));
    }
    curves[k] = c;
  }
  const s = ctx.createWaveShaper();
  s.curve = curves[k];
  return s;
}

// 리버브·딜레이 본체. Esc를 누르면 새로 만들어서 남은 울림까지 끊는다
function buildWet() {
  if (wet) { verbIn.disconnect(); delayIn.disconnect(); wet.forEach(n => n.disconnect()); }
  const conv = ctx.createConvolver();
  conv.buffer = verbBuf;
  const verbOut = gainNode(0.5);
  verbIn.connect(conv).connect(verbOut).connect(master);
  delayNode = ctx.createDelay(2);
  delayNode.delayTime.value = delayTimeForBpm();
  const fb = gainNode(0.35);          // 메아리가 얼마나 반복될지
  const dlf = filterNode("lowpass", 2500);
  delayIn.connect(delayNode);
  delayNode.connect(dlf).connect(fb).connect(delayNode);
  dlf.connect(master);
  wet = [conv, verbOut, delayNode, fb, dlf];
}

// 딜레이 간격 = 점8분음표 (16분음표 3개). BPM이 바뀌면 같이 바뀐다
function delayTimeForBpm() { return Math.min(2, 0.75 * 60 / bpm); }

// 울리는 소리를 기록해 두고, 끝나면 지운다
function track(g, srcs) {
  const v = { g, srcs };
  active.add(v);
  srcs[0].onended = () => active.delete(v);
  return v;
}

function stopAll() {
  const t = ctx.currentTime;
  for (const v of active) {
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setValueAtTime(v.g.gain.value, t);
    v.g.gain.linearRampToValueAtTime(0, t + 0.02);  // 0으로 바로 떨어뜨리면 '틱' 소리가 나서 20ms
    v.srcs.forEach(s => { try { s.stop(t + 0.03); } catch (e) {} });
  }
  held.clear();
  buildWet();
}

// ================= 드럼·효과음 재료 =================
// 음량 모양: decay = 바로 크게 → 줄어듦, rise = 작게 → 커지다 끊김, hold = 유지하다 끊김
function env(g, t, vol, dur, shape = "decay") {
  if (shape === "rise") {
    g.gain.setValueAtTime(0.001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur);
  } else if (shape === "hold") {
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur - 0.01);
    g.gain.linearRampToValueAtTime(0, t + dur);
  } else {
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  }
}

// 1) 음높이가 f0 → f1로 변하는 오실레이터 (킥, 탐, 림, 벨, 라이저 등)
function tone(t, { type = "sine", f0, f1 = f0, drop = 0.05, dur, vol, filter, drive, shape }) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + drop);
  env(g, t, vol, dur, shape);
  let node = o;
  if (filter) node = node.connect(filterNode(filter[0], filter[1]));
  if (drive) node = node.connect(shaper(drive));
  node.connect(g).connect(out);
  o.start(t); o.stop(t + dur);
  track(g, [o]);
}

// 2) 필터를 거친 노이즈 (스네어 '촤', 하이햇, 크래시, 스윕)
function noise(t, { type = "highpass", freq, sweepTo, Q = 1, dur, vol, shape }) {
  const s = ctx.createBufferSource(), f = filterNode(type, freq, Q), g = ctx.createGain();
  s.buffer = noiseBuf; s.loop = true;
  if (sweepTo) {
    f.frequency.setValueAtTime(freq, t);  // 시작점을 박아 두지 않으면 변화가 엉뚱한 시각부터 계산된다
    f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
  }
  env(g, t, vol, dur, shape);
  s.connect(f).connect(g).connect(out);
  s.start(t, Math.random());  // 시작 위치를 섞어서 겹쳐도 같은 노이즈가 되지 않게
  s.stop(t + dur);
  track(g, [s]);
}

// 3) 사각파 6개를 겹친 쇳소리 (808 하이햇·심벌 방식)
const METAL = [205.3, 304.4, 369.6, 522.7, 540, 800];
function metal(t, { hp, dur, vol, shape }) {
  const f = filterNode("highpass", hp), g = ctx.createGain();
  env(g, t, vol, dur, shape);
  f.connect(g).connect(out);
  const oscs = METAL.map(fr => {
    const o = ctx.createOscillator();
    o.type = "square"; o.frequency.value = fr;
    o.connect(f); o.start(t); o.stop(t + dur);
    return o;
  });
  track(g, oscs);
}

// 4) 클랩: 노이즈를 짧게 3번 끊어 친 뒤 꼬리를 남긴다
function clap(t, freq, tail, vol) {
  const s = ctx.createBufferSource(), f = filterNode("bandpass", freq, 1.5), g = ctx.createGain();
  s.buffer = noiseBuf; s.loop = true;
  g.gain.setValueAtTime(0, t);
  for (const d of [0, 0.012, 0.024]) {
    g.gain.setValueAtTime(vol, t + d);
    g.gain.exponentialRampToValueAtTime(0.05, t + d + 0.01);
  }
  g.gain.setValueAtTime(vol, t + 0.036);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.036 + tail);
  s.connect(f).connect(g).connect(out);
  s.start(t, Math.random()); s.stop(t + 0.04 + tail);
  track(g, [s]);
}

    oscs: [["sine", 1, 0, 1]], fm: [1, 2.5, 1.2], amp: { a: 0.003, d: 2.5, s: 0.15, r: 0.4 },
    peak: 0.3, verb: 0.3 },
];

// 악기(def) 하나로 음 하나를 t 시각에 시작한다. 끌 때는 stopVoice
function startVoice(def, midi, t) {
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const amp = ctx.createGain();
  const srcs = [];

  // 오실레이터 → (필터) → (찌그러짐) → 음량 모양(amp)
  let head = ctx.createGain(), tail = head;
  let flt = null;
  if (def.filter) {
    flt = filterNode("lowpass", def.filter.freq, def.filter.Q);
    tail = tail.connect(flt);
    if (def.filter.env) {
      flt.frequency.setValueAtTime(def.filter.env[0], t);
      flt.frequency.exponentialRampToValueAtTime(def.filter.freq, t + def.filter.env[1]);
    }
  }
  if (def.drive) tail = tail.connect(shaper(def.drive));
  tail.connect(amp);

  // 떨림(LFO): 필터를 흔들거나(lfo) 음높이를 흔든다(vibrato)
  const lfo = (rate, depth) => {
    const o = ctx.createOscillator();
    o.frequency.value = rate; o.start(t); srcs.push(o);
    return o.connect(gainNode(depth));
  };
  if (def.filter && def.filter.lfo) lfo(...def.filter.lfo).connect(flt.frequency);
  const vib = def.vibrato ? lfo(...def.vibrato) : null;
  // FM: 다른 오실레이터로 음높이를 아주 빠르게 흔들어 종·피아노 같은 소리를 만든다
  let fmOut = null;
  if (def.fm) {
    const [ratio, index, decay] = def.fm;
    const m = ctx.createOscillator(), mg = ctx.createGain();
    m.frequency.value = f * ratio;
    mg.gain.setValueAtTime(f * index, t);
    mg.gain.exponentialRampToValueAtTime(f * index * 0.1, t + decay);
    m.connect(mg); m.start(t); srcs.push(m);
    fmOut = mg;
  }

  for (const [type, ratio, detune, vol, pan] of def.oscs) {
    const o = ctx.createOscillator();
    o.type = type;
    o.detune.value = detune;
    if (def.pitchEnv) {
      o.frequency.setValueAtTime(f * ratio * def.pitchEnv[0], t);
      o.frequency.exponentialRampToValueAtTime(f * ratio, t + def.pitchEnv[1]);
    } else {
      o.frequency.value = f * ratio;
    }
    if (vib) vib.connect(o.detune);
    if (fmOut) fmOut.connect(o.frequency);
    let node = o.connect(gainNode(vol));
    if (pan && ctx.createStereoPanner) {
      const p = ctx.createStereoPanner();
      p.pan.value = pan;
      node = node.connect(p);
    }
    node.connect(head);
    o.start(t);
    srcs.unshift(o);  // srcs[0]이 소리 나는 오실레이터가 되도록 (끝났는지 확인용)
  }

  // 음량 모양: 어택까지 올라갔다가, d가 있으면 s만큼으로 줄어든다
  const { a, d, s = 1, r } = def.amp;
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(def.peak, t + a);
  if (d) amp.gain.setTargetAtTime(def.peak * s, t + a, d / 4);

  amp.connect(master);
  if (def.verb) amp.connect(gainNode(def.verb)).connect(verbIn);
  if (def.delay) amp.connect(gainNode(def.delay)).connect(delayIn);

  const v = track(amp, srcs);
  Object.assign(v, { start: t, attack: a, release: r });
  return v;
}

// t 시각부터 꼬리(release)를 남기며 줄어든다. 어택이 끝나기 전에는 끄지 않는다
function stopVoice(v, t) {
  t = Math.max(t, v.start + v.attack);
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setTargetAtTime(0, t, v.release / 4);
  v.srcs.forEach(s => { try { s.stop(t + v.release * 1.5); } catch (e) {} });
}

// ================= 시퀀서: 1마디 16스텝 루프 =================
// 소리는 Web Audio 시계로 0.12초 앞까지 미리 예약한다 (setTimeout만으로는 박자가 흔들린다)
const STEPS = 16;
let bpm = 128, playing = false, recording = false, metronome = true;
let events = [];            // 녹음된 소리: {kind: drum|fx|note, step, kit, idx, def, midi, len, recAt}
let nextStep = 0, nextStepTime = 0, timer = null;
let playStep = -1;          // 화면에 표시 중인 재생 위치
const stepQueue = [];       // 예약한 스텝과 시각 (화면 재생 위치를 소리에 맞추려고)
const recNotes = new Map(); // 녹음 중 누르고 있는 건반 code → 이벤트 (뗄 때 길이 기록)

const stepDur = () => 60 / bpm / 4;
// 귀에 들리는 소리는 출력 지연만큼 늦다. 녹음할 때 이만큼 빼서 기록한다
const latency = () => (ctx.outputLatency || 0) + (ctx.baseLatency || 0);

function startPlay() {
  if (!ctx || ctx.state !== "running" || playing) return;
  playing = true;
  nextStep = 0;
  nextStepTime = ctx.currentTime + 0.05;
  timer = setInterval(schedule, 25);
  schedule();
  requestAnimationFrame(tickPlayhead);
}

function stopPlay() {
  playing = false;
  recording = false;
  clearInterval(timer);
  stepQueue.length = 0;
  playStep = -1;
  recNotes.clear();
  renderGrid();
}

function schedule() {
  // 화면이 꺼졌다 돌아오면 밀린 박자를 한꺼번에 치지 않고 지금부터 다시 시작
  if (nextStepTime < ctx.currentTime - 0.2) nextStepTime = ctx.currentTime + 0.05;
  while (nextStepTime < ctx.currentTime + 0.12) {
    playStepAt(nextStep, nextStepTime);
    stepQueue.push({ step: nextStep, time: nextStepTime });
    nextStepTime += stepDur();
    nextStep = (nextStep + 1) % STEPS;
  }
}

function playStepAt(step, t) {
  if (metronome && step % 4 === 0) click(t, step === 0);
  for (const ev of events) {
    if (ev.step !== step) continue;
    // 방금 손으로 친 소리가 같은 바퀴에서 또 울리지 않게
    if (ev.recAt !== undefined && Math.abs(ev.recAt - t) < stepDur() / 2) continue;
    playEvent(ev, t);
  }
}

function playEvent(ev, t) {
  if (ev.kind === "drum") { out = kitBuses[ev.kit]; KITS[ev.kit].hits[ev.idx](t); }
  else if (ev.kind === "fx") { out = fxBus; FX[ev.idx].play(t); }
  else stopVoice(startVoice(ev.def, ev.midi, t), t + ev.len * stepDur());
}

// 메트로놈: 한 박마다 '틱', 마디 첫 박은 높게
function click(t, accent) {
  out = master;
  tone(t, { type: "square", f0: accent ? 1800 : 1200, dur: 0.03, vol: 0.12 });
}

// 지금 들리는 위치를 가장 가까운 16분음표로 맞춘다 → {step, at(그 스텝의 시각)}
function quantize() {
  const k = Math.round((ctx.currentTime - latency() - nextStepTime) / stepDur());
  return { step: (((nextStep + k) % STEPS) + STEPS) % STEPS, at: nextStepTime + k * stepDur() };
}

function record(ev) {
  if (!recording || !playing) return null;
  const q = quantize();
  ev.step = q.step;
  ev.recAt = q.at;
  events.push(ev);
  renderGrid();
  return ev;
}

// 화면의 재생 위치: 예약해 둔 스텝이 실제로 들릴 때 옮긴다
function tickPlayhead() {
  if (!playing) return;
  requestAnimationFrame(tickPlayhead);
  let moved = false;
  while (stepQueue.length && stepQueue[0].time + (ctx.outputLatency || 0) <= ctx.currentTime) {
    playStep = stepQueue.shift().step;
    moved = true;
  }
  if (moved) renderGrid();
}

function setBpm(v) {
  bpm = Math.max(60, Math.min(200, v));
  if (delayNode) delayNode.delayTime.setTargetAtTime(delayTimeForBpm(), ctx.currentTime, 0.05);
}

// ================= 랜덤 (Q) =================
// Mutable Instruments Grids에서 착안: 완전 무작위가 아니라 장르마다 '이 자리에 칠 확률' 지도를 두고 굴린다
const ALL = [...Array(16).keys()];
const EVEN = ALL.filter(i => i % 2 === 0), ODD = ALL.filter(i => i % 2 === 1);
// [드럼 자리, 스텝들, 확률]. 자리: 0킥 1스네어 2클랩 3닫힌HH 4열린HH 5로우탐 6하이탐 7림 8퍼커션 9크래시
const STYLES = {
  house:   { bass: [2, 6, 10, 14], drums: [[0, [0, 4, 8, 12], 1], [2, [4, 12], 0.95], [3, ALL, 0.4], [4, [2, 6, 10, 14], 0.9],
            [7, [3, 7, 11, 15], 0.25], [8, ALL, 0.08], [5, [13, 15], 0.15], [9, [0], 0.25]] },
  techno:  { bass: [2, 6, 10, 14, 3, 11], drums: [[0, [0, 4, 8, 12], 1], [1, [4, 12], 0.5], [2, [4, 12], 0.4], [3, ALL, 0.6],
            [4, [2, 6, 10, 14], 0.8], [5, [2, 3, 6, 7, 10, 11, 14, 15], 0.35], [7, ALL, 0.15], [8, ALL, 0.1]] },
  trap:    { bass: "kick", drums: [[0, [0], 1], [0, [3, 6, 7, 10, 11, 14], 0.3], [1, [8], 1], [2, [8], 0.6], [3, EVEN, 1],
            [3, ODD, 0.35], [4, [14], 0.3], [7, [4, 12], 0.3], [8, ALL, 0.06], [5, [13, 15], 0.2]] },
  hiphop:  { bass: "kick", drums: [[0, [0, 10], 0.95], [0, [3, 7, 13], 0.3], [1, [4, 12], 1], [3, EVEN, 0.9], [4, [14], 0.3],
            [7, ODD, 0.1], [8, ALL, 0.05]] },
  boombap: { bass: [0, 3, 6, 8, 10, 13], drums: [[0, [0, 10], 0.95], [0, [7, 13], 0.35], [1, [4, 12], 1], [3, EVEN, 0.85],
            [3, ODD, 0.15], [8, ALL, 0.3], [9, EVEN, 0.15]] },
  pop:     { bass: [0, 2, 4, 6, 8, 10, 12, 14], drums: [[0, [0, 8], 1], [0, [6, 10], 0.3], [1, [4, 12], 1], [3, EVEN, 0.95],
            [4, [14], 0.3], [8, [4, 12], 0.6], [5, [14, 15], 0.35], [6, [12, 13], 0.35]] },
  chip:    { bass: [0, 2, 4, 6, 8, 10, 12, 14], drums: [[0, [0, 8], 1], [0, [6, 11], 0.3], [1, [4, 12], 1], [3, EVEN, 0.8],
            [7, ALL, 0.1], [8, [15], 0.15], [5, [13, 14, 15], 0.2]] },
};
// 장르별 기본 베이스 악기 (지금 고른 악기가 베이스 묶음 1~4면 그걸 쓴다)
const STYLE_BASS = { house: 0, techno: 2, trap: 1, hiphop: 1, boombap: 0, pop: 0, chip: 7 };
const MINOR = [0, 2, 3, 5, 7, 8, 10];

function randomBeat() {
  const kit = KITS[kitIndex], st = STYLES[kit.style];
  events = [];
  const kicks = [];
  for (const [idx, steps, p] of st.drums) {
    for (const step of steps) {
      if (Math.random() >= p) continue;
      if (events.some(e => e.idx === idx && e.step === step)) continue;
      events.push({ kind: "drum", kit: kitIndex, idx, step });
      if (idx === 0) kicks.push(step);
    }
  }
  // 베이스: 장르가 정한 자리(또는 킥 자리)에, 근음 위주로 단조 음계에서 고른다
  const def = inst >= 0 && inst <= 3 ? INSTS[inst] : INSTS[STYLE_BASS[kit.style]];
  const root = [0, 2, 5, 7, 9][Math.floor(Math.random() * 5)];
  const slots = (st.bass === "kick" ? kicks : st.bass).filter(() => Math.random() < 0.8).sort((x, y) => x - y);
  slots.forEach((step, i) => {
    const r = Math.random();
    const deg = r < 0.5 ? 0 : r < 0.7 ? 7 : r < 0.8 ? 12 : MINOR[Math.floor(Math.random() * MINOR.length)];
    // 트랩·힙합은 다음 음까지 길게 끌고, 나머지는 짧게
    const next = slots[i + 1] !== undefined ? slots[i + 1] : slots[0] + STEPS;
    const len = st.bass === "kick" ? Math.min(8, next - step) : 1 + (Math.random() < 0.3 ? 1 : 0);
    events.push({ kind: "note", def, midi: 36 + root + deg, len, step });
  });
  if (!playing) startPlay();
  renderGrid();
}

// Shift+Q: 매번 새로운 합성 음색을 만들어 지금 악기로 바꾸고 한 번 들려준다
let randomCount = 0;
function randomTone() {
  const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const n = 1 + Math.floor(Math.random() * 3);
  const oscs = [];
  for (let i = 0; i < n; i++)
    oscs.push([pick(["sawtooth", "square", "triangle", "sine"]), pick([0.5, 1, 1, 1, 2]), rnd(-25, 25), 1, rnd(-0.6, 0.6)]);
  const def = { short: "랜덤", name: "랜덤 음색 " + (++randomCount), base: pick([36, 48, 60, 60]), oscs,
                amp: { a: pick([0.002, 0.01, 0.05, 0.3]), r: rnd(0.05, 0.8) }, peak: 0.25 / Math.sqrt(n) };
  if (Math.random() < 0.8) def.filter = { freq: rnd(300, 5000), Q: rnd(0.5, 12) };
  if (def.filter && Math.random() < 0.6) def.filter.env = [rnd(2000, 9000), rnd(0.05, 0.5)];
  if (def.filter && Math.random() < 0.3) def.filter.lfo = [rnd(0.2, 6), rnd(100, 800)];
  if (Math.random() < 0.4) { def.amp.d = rnd(0.1, 1); def.amp.s = rnd(0, 0.6); }
  if (Math.random() < 0.25) def.vibrato = [rnd(3, 7), rnd(5, 30)];
  if (Math.random() < 0.25) def.fm = [pick([0.5, 1, 2, 3.5]), rnd(0.5, 4), rnd(0.2, 1.5)];
  if (Math.random() < 0.3) def.drive = pick([2, 4, 8]);
  if (Math.random() < 0.2) def.pitchEnv = [rnd(1.5, 4), rnd(0.02, 0.15)];
  if (Math.random() < 0.6) def.verb = rnd(0.1, 0.5);
  if (Math.random() < 0.4) def.delay = rnd(0.1, 0.35);
  randomDef = def;
  inst = -1;
  const t = ctx.currentTime;
  stopVoice(startVoice(def, def.base + octave * 12, t), t + 0.35);
}

// ================= 키 입력 =================
function onKeyDown(e) {
  if (e.metaKey) return;  // Cmd 조합은 iOS 몫으로 남겨 둔다
  e.preventDefault();     // 스크롤, 포커스 이동 등 기본 동작 막기
  if (e.repeat) return;   // 꾹 누를 때 생기는 반복 입력 무시
  const code = e.code;
  pressed.add(code);

  const instIdx = INSTS.findIndex(i => i.key === code);
  const d = DRUM_KEYS.indexOf(code);
  const ready = ctx && ctx.state === "running";
  if (instIdx >= 0) inst = instIdx;
  else if (code === "ArrowRight") kitIndex = (kitIndex + 1) % KITS.length;
  else if (code === "ArrowLeft") kitIndex = (kitIndex + KITS.length - 1) % KITS.length;
  else if (code === "ArrowUp") octave = Math.min(OCT_MAX, octave + 1);
  else if (code === "ArrowDown") octave = Math.max(OCT_MIN, octave - 1);
  else if (code === "Backquote") toggleViz();
  else if (code === "Minus") setBpm(bpm - (e.shiftKey ? 5 : 1));
  else if (code === "Equal") setBpm(bpm + (e.shiftKey ? 5 : 1));
  else if (code === "Tab") metronome = !metronome;
  else if (code === "Backspace") { if (e.shiftKey) events = []; else events.pop(); renderGrid(); }
  else if (ready) {
    const t = ctx.currentTime;
    if (d >= 0 && e.shiftKey) { out = fxBus; FX[d].play(t); record({ kind: "fx", idx: d }); }
    else if (d >= 0) { out = kitBuses[kitIndex]; KITS[kitIndex].hits[d](t); record({ kind: "drum", kit: kitIndex, idx: d }); }
    else if (code in NOTE_KEYS) {
      const def = curDef(), midi = def.base + octave * 12 + NOTE_KEYS[code];
      held.set(code, startVoice(def, midi, t));
      const ev = record({ kind: "note", def, midi, len: 1 });
      if (ev) recNotes.set(code, ev);
    }
    else if (code === "KeyQ") { if (e.shiftKey) randomTone(); else randomBeat(); }
    else if (code === "Space") { if (playing) stopPlay(); else startPlay(); }
    else if (code === "Enter") { if (!playing) { startPlay(); recording = true; } else recording = !recording; }
    else if (code === "Escape") { stopAll(); stopPlay(); }
  }
  render();
}

function onKeyUp(e) {
  if (e.metaKey) return;
  e.preventDefault();
  pressed.delete(e.code);
  // 녹음 중이던 건반이면 누른 길이를 16분음표 단위로 기록
  const ev = recNotes.get(e.code);
  if (ev) {
    recNotes.delete(e.code);
    ev.len = Math.max(1, Math.min(STEPS, Math.round((ctx.currentTime - latency() - ev.recAt) / stepDur())));
    renderGrid();
  }
  const v = held.get(e.code);
  if (v) { held.delete(e.code); stopVoice(v, ctx.currentTime); }
  render();
}

window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);

// ================= 시작 버튼 / iOS 대응 =================
$("start").addEventListener("click", async () => {
  if (navigator.audioSession) {
    try { navigator.audioSession.type = "playback"; } catch (e) {}
  }
  if (!ctx) {
    initAudio(new (window.AudioContext || window.webkitAudioContext)());
    ctx.addEventListener("statechange", render);
  }
  await ctx.resume();
  $("start").blur();
  render();
});

// 다른 앱에 갔다가 돌아왔을 때 오디오가 멈춰 있으면 다시 켠다
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && ctx && ctx.state !== "running") {
    ctx.resume().then(render);
  }
});

// ================= 시각화 =================
// 지금 나는 소리의 파형을 잔상이 남는 선으로 그린다. 소리가 클수록 굵고 밝아진다
let vizOn = false, vizData = null, energy = 0;
const canvas = $("vizCanvas"), g2d = canvas.getContext("2d");

function toggleViz() {
  vizOn = !vizOn;
  $("viz").style.display = vizOn ? "block" : "none";
  if (vizOn) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    requestAnimationFrame(drawViz);
  }
  render();
}
$("viz").addEventListener("click", toggleViz);  // 키보드가 끊겼을 때를 대비해 화면을 탭해도 꺼진다

function drawViz(now) {
  if (!vizOn) return;
  requestAnimationFrame(drawViz);
  const w = canvas.width, h = canvas.height;
  g2d.fillStyle = "rgba(0, 0, 0, 0.12)";  // 완전히 지우지 않고 살짝 덮어서 잔상을 남긴다
  g2d.fillRect(0, 0, w, h);
  if (!analyser) return;
  if (!vizData) vizData = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(vizData);

  let sum = 0;
  for (const x of vizData) sum += x * x;
  const rms = Math.sqrt(sum / vizData.length);
  energy = Math.max(rms, energy * 0.92);  // 갑자기 커지고 천천히 줄어들게

  const hue = (now / 40 + energy * 600) % 360;
  g2d.lineWidth = (2 + Math.min(10, energy * 15)) * (w / window.innerWidth);
  g2d.lineJoin = "round";
  // 파형 2줄: 원래 모양과 위아래를 뒤집은 모양, 색은 서로 반대
  // 앞쪽 512개(약 10ms)만 그려야 물결이 너무 빽빽하지 않다
  const N = 512;
  for (const [flip, hueShift] of [[1, 0], [-1, 180]]) {
    g2d.strokeStyle = `hsl(${(hue + hueShift) % 360}, 100%, ${Math.min(85, 55 + energy * 120)}%)`;
    g2d.beginPath();
    for (let i = 0; i < N; i += 2) {
      const x = (i / (N - 2)) * w;
      const y = h / 2 + flip * vizData[i] * h * 0.45;
      if (i === 0) g2d.moveTo(x, y); else g2d.lineTo(x, y);
    }
    g2d.stroke();
  }
}

// ================= 화면 =================
const ROWS = [
  [["Backquote","`"],["Digit1","1"],["Digit2","2"],["Digit3","3"],["Digit4","4"],["Digit5","5"],
   ["Digit6","6"],["Digit7","7"],["Digit8","8"],["Digit9","9"],["Digit0","0"],["Minus","-"],["Equal","="]],
  [["KeyQ","Q"],["KeyW","W"],["KeyE","E"],["KeyR","R"],["KeyT","T"],["KeyY","Y"],["KeyU","U"],
   ["KeyI","I"],["KeyO","O"],["KeyP","P"],["BracketLeft","["],["BracketRight","]"],["Backslash","\\"]],
  [["KeyA","A"],["KeyS","S"],["KeyD","D"],["KeyF","F"],["KeyG","G"],["KeyH","H"],["KeyJ","J"],
   ["KeyK","K"],["KeyL","L"],["Semicolon",";"],["Quote","'"]],
  [["KeyZ","Z"],["KeyX","X"],["KeyC","C"],["KeyV","V"],["KeyB","B"],["KeyN","N"],["KeyM","M"],
   ["Comma",","],["Period","."],["Slash","/"]],
];

// 안내도와 격자는 한 번만 만들고, 이후에는 글자와 클래스만 바꾼다
const keyEls = {};
ROWS.forEach((row, ri) => {
  const r = document.createElement("div");
  r.className = "kr r" + ri;
  for (const [code, ch] of row) {
    const k = document.createElement("div");
    k.innerHTML = "<b></b><span></span>";
    k.firstChild.textContent = ch;
    r.appendChild(k);
    keyEls[code] = k;
  }
  $("kb").appendChild(r);
});

const cells = [];
for (let n = 0; n < 11 * STEPS; n++) {
  const el = document.createElement("div");
  $("grid").appendChild(el);
  cells.push(el);
}

// 격자: 위 10줄 = 드럼 자리(Z줄 순서), 맨 아래 1줄 = 멜로디
function renderGrid() {
  const m = Array.from({ length: 11 }, () => new Array(STEPS).fill(""));
  for (const ev of events) {
    if (ev.kind === "note") {
      for (let i = ev.len - 1; i >= 0; i--) m[10][(ev.step + i) % STEPS] = i ? "mel tail" : "mel";
    } else if (m[ev.idx][ev.step] !== "fx") {
      m[ev.idx][ev.step] = ev.kind === "fx" ? "fx" : "hit";
    }
  }
  cells.forEach((el, n) => {
    const r = Math.floor(n / STEPS), c = n % STEPS;
    let cls = "c";
    if (c % 4 === 0) cls += " down";
    if (c % 4 === 3 && c < STEPS - 1) cls += " gap";
    if (r === 10) cls += " melrow";
    if (c === playStep) cls += " ph";
    if (m[r][c]) cls += " " + m[r][c];
    el.className = cls;
  });
}

function octText(short) {
  const def = curDef();
  const sign = octave > 0 ? "+" : "";
  const note = LETTER_NAMES[0] + (Math.floor((def.base + octave * 12) / 12) - 1);
  return short ? `${sign}${octave} · ${note}` : `${sign}${octave} (A = ${note})`;
}

function render() {
  const kit = KITS[kitIndex];
  const shiftHeld = pressed.has("ShiftLeft") || pressed.has("ShiftRight");
  for (const code in keyEls) {
    const k = keyEls[code];
    let label = "", cls = "k";
    const d = DRUM_KEYS.indexOf(code);
    const instIdx = INSTS.findIndex(i => i.key === code);
    if (d >= 0 && shiftHeld) { label = FX[d].short; cls += " fx"; }
    else if (d >= 0) { label = (kit.names && kit.names[d]) || DRUM_NAMES[d]; cls += " drum"; }
    else if (code in NOTE_KEYS) {
      const n = NOTE_KEYS[code] % 12;
      label = NOTE_NAMES[n];
      cls += NOTE_NAMES[n].includes("#") ? " black" : " white";
    }
    else if (instIdx >= 0) {
      label = INSTS[instIdx].short;
      cls += " inst" + (instIdx <= 3 ? " bass" : "") + (instIdx === inst ? " sel" : "");
    }
    else if (code === "Backquote") { label = "파형"; cls += " func" + (vizOn ? " sel" : ""); }
    else if (code === "KeyQ") { label = shiftHeld ? "음\n색" : "랜\n덤"; cls += " func" + (inst === -1 ? " sel" : ""); }
    else if (code === "Minus") { label = shiftHeld ? "−5" : "BPM−"; cls += " func"; }
    else if (code === "Equal") { label = shiftHeld ? "+5" : "BPM+"; cls += " func"; }
    if (pressed.has(code)) cls += " on";
    k.className = cls;
    k.lastChild.textContent = label;
  }

  const def = curDef();
  const num = inst === -1 ? "R" : String((inst + 1) % 10);
  const color = inst === -1 ? "var(--txt)" : inst <= 3 ? "var(--bass)" : "var(--mel)";
  $("instNum").textContent = num;
  $("instNum").style.color = color;
  $("instName").textContent = def.name;
  $("kit").textContent = `${kit.name} ${kitIndex + 1}/${KITS.length}`;
  $("oct").textContent = octText(false);
  $("vNum").textContent = num;
  $("vNum").style.color = color;
  $("vName").textContent = def.name;
  $("vKit").textContent = kit.name;
  $("vOct").textContent = octText(true);

  const on = !!ctx && ctx.state === "running";
  $("dot").classList.toggle("on", on);
  $("stateTxt").textContent = "오디오 " + (on ? "켜짐" : "꺼짐");
  $("start").style.display = on ? "none" : "flex";
  $("start").querySelector(".st-sub").textContent = ctx ? "탭해서 다시 켜기" : "탭해서 소리 켜기";
  $("seq").style.display = on ? "flex" : "none";

  $("bpm").textContent = bpm;
  $("chipPlay").textContent = playing ? "▶ 재생" : "■ 정지";
  $("chipPlay").classList.toggle("on", playing);
  $("chipRec").classList.toggle("on", recording);
  $("chipMet").classList.toggle("on", metronome);
  $("shiftChip").classList.toggle("on", shiftHeld);
}
render();
renderGrid();
</script>
</body>
</html>
