<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Curly MusicKey</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --bg: #050607; --panel: #0e1012; --line: #1d2025; --dim: #7d858c; --txt: #f2f4f5;
    --amber: #ffb000; --cyan: #7fe3ff; --red: #ff4d3d; --bass: #56d6b0; --mel: #8ab4ff; --usr: #ff6bd6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--txt);
               font-family: -apple-system, "SF Pro Text", "Apple SD Gothic Neo", system-ui, sans-serif; }
  button { font: inherit; }
  /* 폰은 화면 꽉 차게, 맥북처럼 넓은 화면에서는 가운데 480px */
  #app { min-height: 100dvh; padding: 10px 8px; display: flex; flex-direction: column; gap: 10px; max-width: 480px; margin: 0 auto; }
  small { font-size: 10px; font-weight: 700; color: var(--dim); }
  .sp { flex: 1; }

  /* 상단 LCD */
  .lcd { background: var(--panel); border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line);
         padding: 8px 11px 9px; display: flex; flex-direction: column; gap: 5px; }
  .lcd-top { display: flex; align-items: center; gap: 8px; }
  .brand { font-size: 9px; letter-spacing: .14em; font-weight: 800; color: var(--dim); white-space: nowrap; }
  .lcd-top > * { white-space: nowrap; flex: none; }
  .lcd-top .sp { flex: 1; }
  .slot { font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--amber); }
  .lbtn { border: none; border-radius: 4px; background: #1d2025; color: var(--txt); font-size: 11px; font-weight: 800;
          padding: 2px 8px; }
  #load { color: var(--usr); }
  .vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
  #state { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; }
  #dot { width: 8px; height: 8px; border-radius: 4px; background: #3a3f45; }
  #dot.on { background: var(--bass); box-shadow: 0 0 8px var(--bass); }
  .lcd-mid { display: flex; align-items: center; gap: 8px; height: 40px; }
  .lcd-inst { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
  .num { font-family: var(--mono); font-size: 24px; font-weight: 800; line-height: 1; }
  .num.bass { color: var(--bass); } .num.mel { color: var(--mel); } .num.rnd { color: var(--txt); } .num.usr { color: var(--usr); }
  #instName { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; }
  #mini { width: 110px; height: 40px; flex: none; border-radius: 4px; background: #000; }
  .lcd-sub { display: flex; gap: 12px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 6px; white-space: nowrap; }
  .lcd-sub div { display: flex; align-items: baseline; gap: 5px; }
  #kit { font-size: 15px; font-weight: 800; color: var(--amber); }
  #oct { font-size: 15px; font-weight: 800; color: var(--cyan); }
  #keyInfo { font-size: 12px; font-weight: 700; color: #cfd6dc; margin-left: auto; }

  /* 시작 화면 */
  #startWrap { display: flex; flex-direction: column; gap: 6px; flex: none; }
  #start { height: 96px; border: none; border-radius: 8px; background: #e8ecef; color: var(--bg);
           display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .st-main { display: flex; align-items: center; gap: 12px; font-size: 44px; font-weight: 900; letter-spacing: -0.03em; line-height: 1; }
  .st-main i { width: 14px; height: 14px; border-radius: 7px; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
  .st-sub { font-size: 13px; font-weight: 700; color: #4a5158; }
  .opt { border: none; border-radius: 6px; background: var(--panel); color: #cfd6dc; text-align: left; padding: 5px 10px;
         box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; gap: 2px; }
  .opt b { font-size: 13px; } .opt span { font-size: 10px; color: var(--dim); }
  .opt.on { box-shadow: inset 3px 0 0 var(--amber), inset 0 0 0 1px #3a2c10; }
  .opt.on b { color: var(--amber); }

  /* 시퀀서 */
  #seq { display: none; flex-direction: column; gap: 6px; padding: 0 2px; flex: none; }
  .seq-top { display: flex; align-items: baseline; gap: 6px; height: 24px; }
  #bpm { font-family: var(--mono); font-size: 22px; font-weight: 800; line-height: 1; }
  .bar { font-family: var(--mono); font-size: 11px; font-weight: 800; color: var(--cyan); margin-left: 4px; }
  .chip { font-family: var(--mono); font-size: 10px; font-weight: 800; padding: 3px 6px; border-radius: 3px;
          letter-spacing: .04em; align-self: center; color: #3a3f45; box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
  #chipPlay.on { background: var(--cyan); color: #001a22; box-shadow: none; }
  #chipRec.on { background: var(--red); color: #0a0201; box-shadow: none; }
  #chipMet.on { background: #e8ecef; color: var(--bg); box-shadow: none; }
  #chipMode { background: var(--amber); color: #0a0700; box-shadow: none; }
  #shiftChip.on { background: var(--red); color: #0a0201; box-shadow: none; }

  /* 격자: 왼쪽 이름 칸 + 16칸. 드럼 줄은 얇게, 악기 트랙 줄은 조금 두껍게 */
  #grid { display: grid; grid-template-columns: 24px repeat(16, minmax(0, 1fr)); gap: 2px; }
  .rl { height: 6px; font-size: 8px; font-weight: 800; line-height: 9px; overflow: hidden; white-space: nowrap; }
  .rl.tr { height: 9px; }
  .rl.bass { color: var(--bass); } .rl.mel { color: var(--cyan); } .rl.rnd { color: var(--txt); } .rl.usr { color: var(--usr); }
  .c { height: 6px; border-radius: 2px; background: #111316; }
  .c.tr { height: 9px; }
  .c.down { background: #181b1f; }
  .c.ph { background: #2f353c; }
  .c.hit { background: var(--amber); }
  .c.fx { background: var(--red); }
  .c.n.bass { background: var(--bass); } .c.n.mel { background: var(--cyan); }
  .c.n.rnd { background: var(--txt); } .c.n.usr { background: var(--usr); }
  .c.tail { opacity: .5; }
  .c.ph.hit, .c.ph.fx, .c.ph.n { background: #fff; opacity: 1; }
  .c.cur { box-shadow: 0 0 0 2px var(--txt); }
  .c.gap { margin-right: 3px; }
  .first { margin-top: 3px; }

  /* 키보드 안내도: 자주 쓰는 Z줄·A줄은 높게, 줄마다 남는 폭은 그 줄 키들이 나눠 가진다 */
  .kbwrap { display: flex; flex-direction: column; gap: 3px; margin-top: auto; }
  .kbhead { display: flex; justify-content: space-between; align-items: center; height: 18px; gap: 6px; }
  #msg { font-size: 11px; font-weight: 700; color: var(--amber); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
         opacity: 0; transition: opacity 150ms; }
  #msg.show { opacity: 1; }
  .kr { display: flex; gap: 3px; flex: none; }
  .kr.r0 { height: 30px; }
  .kr.r1 { height: 44px; padding-left: 12px; }
  .kr.r2 { height: 58px; padding-left: 20px; }
  .kr.r3 { height: 64px; padding-left: 30px; }
  .k { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between;
       padding: 3px 2px 4px; overflow: hidden; border-radius: 4px; background: #0b0c0e; color: #2f343a;
       transition: transform 80ms ease-out; }
  .k b { display: block; text-align: left; font-family: var(--mono); font-size: 9px; font-weight: 700; opacity: .6; line-height: 1; }
  .k span { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;
            white-space: pre-line; letter-spacing: -0.03em; line-height: 1; font-weight: 800; }
  .r0 .k b { font-size: 11px; font-weight: 800; text-align: center; opacity: 1; }
  .r0 .k span { font-size: 8px; font-weight: 700; }
  .r1 .k b { font-size: 8px; }
  .r1 .k span { font-size: 10px; letter-spacing: -0.08em; }
  .r2 .k span { font-size: 21px; }
  .r3 .k span { font-size: 12px; line-height: 1.05; letter-spacing: -0.06em; }

  .k.drum { background: #15110a; color: var(--amber); box-shadow: inset 0 3px 0 var(--amber), inset 0 0 0 1px #3a2c10; border-radius: 6px; }
  .k.drum.on { background: var(--amber); color: #0a0700; box-shadow: 0 0 18px rgba(255,176,0,.75); transform: scale(.92); }
  .k.fx { background: var(--red); color: #0a0201; box-shadow: inset 0 0 0 1px #ff8a7e; border-radius: 6px; }
  .k.fx.on { background: #ffd0cb; color: #3a0500; box-shadow: 0 0 0 2px var(--red), 0 0 18px rgba(255,77,61,.85); transform: scale(.92); }
  .k.white { background: #e8ecef; color: #0b0d0f; }
  .k.black { background: #000; color: #cfd6dc; box-shadow: inset 0 0 0 1px #2f343a; }
  .k.white.on, .k.black.on { background: var(--cyan); color: #001a22; box-shadow: 0 0 16px rgba(127,227,255,.75); transform: translateY(3px); }
  .k.inst { --g: var(--mel); background: var(--panel); color: var(--g); box-shadow: inset 0 -2px 0 var(--g); }
  .k.inst.bass { --g: var(--bass); }
  .k.inst.sel { background: var(--g); color: #000; box-shadow: 0 0 12px var(--g); }
  .k.usr { background: var(--panel); color: #5a3a52; box-shadow: inset 0 -2px 0 #5a3a52; }
  .k.usr.has { color: var(--usr); box-shadow: inset 0 -2px 0 var(--usr); }
  .k.usr.sel { background: var(--usr); color: #000; }
  .k.usr.recing { background: var(--red); color: #000; animation: blink .6s infinite alternate; }
  @keyframes blink { to { opacity: .4; } }
  /* 조각 모드: A~P가 조각 패드 */
  .k.chop { background: #1f0d1b; color: var(--usr); box-shadow: inset 0 3px 0 var(--usr), inset 0 0 0 1px #4a1f42; border-radius: 6px; }
  .k.chop.all { background: #3a1534; }
  .r2 .k.chop.all span, .r2 .k.func span { font-size: 13px; }
  .k.chop.on { background: var(--usr); color: #000; box-shadow: 0 0 16px rgba(255,107,214,.7); transform: scale(.92); }
  .k.func { background: var(--panel); color: #cfd6dc; box-shadow: inset 0 -2px 0 #cfd6dc; }
  .k.func.sel { background: var(--txt); color: #000; }
  .k.inst.on, .k.func.on, .k.usr.on { transform: scale(.92); }

  /* 큰 시각화: 화면 전체를 덮고, 맨 아래에 정보 띠 */
  #viz { position: fixed; inset: 0; background: #000; display: none; z-index: 10; }
  #viz canvas { width: 100%; height: 100%; display: block; }
  .vband { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 10px 14px;
           border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: #000; }
  .vrow { display: flex; align-items: baseline; gap: 14px; white-space: nowrap; overflow: hidden; }
  #vNum { font-size: 19px; }
  #vName { font-size: 19px; font-weight: 800; }
  #vKit { font-size: 17px; font-weight: 800; color: var(--amber); }
  #vOct { font-size: 17px; font-weight: 800; color: var(--cyan); }
  .vclose { align-self: flex-end; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700;
            color: #cfd6dc; box-shadow: inset 0 0 0 1px #2f343a; border-radius: 999px; padding: 5px 12px; }
  .vclose b { font-family: var(--mono); }

  /* 도움말·내보내기 창 */
  #overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.85); display: none;
             align-items: center; justify-content: center; padding: 10px; }
  .panel { background: var(--panel); border-radius: 10px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px;
           width: 100%; max-width: 420px; max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .panel h2 { margin: 0 0 4px; font-size: 18px; }
  .panel h3 { margin: 6px 0 0; font-size: 11px; color: var(--amber); letter-spacing: .1em; }
  .hl div { display: flex; gap: 8px; align-items: baseline; font-size: 12px; padding: 1px 0; }
  .hl kbd { flex: none; min-width: 84px; }
  kbd { font-family: var(--mono); font-size: 10px; font-weight: 800; color: var(--bg); background: #cfd6dc;
        border-radius: 3px; padding: 1px 4px; }
  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices.col { flex-direction: column; }
  .choices span { padding: 8px 10px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; font-weight: 700; color: var(--dim); }
  .choices span.sel { background: var(--amber); color: #0a0700; box-shadow: none; }
  .msgline { min-height: 2.6em; font-size: 13px; color: var(--cyan); margin: 4px 0 0; }
  .dim { color: var(--dim); font-size: 11px; margin: 0; }
  .kbsel { border: none; border-radius: 6px; background: #1d2025; color: var(--amber); font-weight: 800; font-size: 12px; padding: 6px 10px; align-self: flex-start; }
  .note { font-size: 11px; color: #cfd6dc; background: #15110a; border-radius: 6px; padding: 6px 8px; margin: 0; }
</style>
</head>
<body>
<div id="app">
  <div class="lcd">
    <div class="lcd-top">
      <span class="brand">CURLY MUSICKEY</span>
      <span id="slotInfo" class="slot"></span>
      <span class="sp"></span>
      <!-- label을 탭하면 브라우저가 직접 파일 선택 창을 연다 (아이폰에서 가장 확실한 방법) -->
      <label id="load" class="lbtn" for="file"></label>
      <input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.aac,.aif,.aiff,.caf,.flac,.ogg" class="vh">
      <button id="lang" class="lbtn">EN</button>
      <span id="state"><i id="dot"></i><span id="stateTxt"></span></span>
    </div>
    <div class="lcd-mid">
      <div class="lcd-inst"><span id="instNum" class="num"></span><span id="instName"></span></div>
      <canvas id="mini"></canvas>
    </div>
    <div class="lcd-sub">
      <div><small id="kbLabelK"></small><span id="kit"></span></div>
      <div><small id="kbLabelO"></small><span id="oct"></span></div>
      <span id="keyInfo"></span>
    </div>
  </div>

  <div id="startWrap">
    <button id="start">
      <span class="st-main"><i></i><span id="startMain"></span></span>
      <span id="startSub" class="st-sub"></span>
    </button>
    <button id="optEvo" class="opt"></button>
    <button id="optSession" class="opt"></button>
    <button id="optKb" class="opt on"></button>
  </div>

  <div id="seq">
    <div class="seq-top">
      <span id="bpm"></span><small>BPM</small><span id="barInfo" class="bar"></span><span class="sp"></span>
      <span id="chipMode" class="chip"></span>
      <span id="chipPlay" class="chip"></span>
      <span id="chipRec" class="chip"></span>
      <span id="chipMet" class="chip"></span>
    </div>
    <div id="grid"></div>
  </div>

  <div class="kbwrap">
    <div class="kbhead"><span id="msg"></span><span id="shiftChip" class="chip"></span></div>
    <div id="kb"></div>
  </div>
</div>

<div id="viz">
  <canvas id="vizCanvas"></canvas>
  <div class="vband">
    <div class="vrow">
      <span><span id="vNum" class="num"></span> <span id="vName"></span></span>
      <span id="vKit"></span>
      <span id="vOct"></span>
    </div>
    <span class="vclose"><b>`</b><span id="vClose"></span></span>
  </div>
</div>

<div id="overlay"></div>

<!-- 순서가 중요하다: 글자 → 소리 → 시퀀서 → 랜덤 → 저장·마이크·내보내기 → 화면
     ?v=숫자: 배포할 때마다 올린다. 안 올리면 폰이 예전 js를 기억해 두고 새 화면과 섞어 써서 오류가 난다 -->

<!-- MP3 인코더: lamejs 1.2.1 (LGPL-3.0, https://github.com/zhuker/lamejs), 고치지 않은 원본 -->
<script src="js/lib/lame.min.js?v=3"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/audio.js?v=3"></script>
<script src="js/seq.js?v=3"></script>
<script src="js/random.js?v=3"></script>
<script src="js/io.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
</body>
</html>
